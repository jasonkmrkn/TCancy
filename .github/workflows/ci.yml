name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tcancy
          POSTGRES_PASSWORD: tcancy
          POSTGRES_DB: tcancy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcancy -d tcancy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tcancy:tcancy@localhost:5432/tcancy_test
      REDIS_TEST_URL: redis://localhost:6379/15
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Generate secrets for this run
        run: |
          set -euo pipefail
          for entry in "SESSION_SECRET=$(openssl rand -hex 32)" \
                       "MASTER_KEY=$(openssl rand -base64 32)" \
                       "BLIND_INDEX_KEY=$(openssl rand -hex 32)"; do
            echo "::add-mask::${entry#*=}"
            echo "$entry" >> "$GITHUB_ENV"
          done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.8.6

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint