name: tcancy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcancy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcancy}
      POSTGRES_DB: ${POSTGRES_DB:-tcancy}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tcancy}:${POSTGRES_PASSWORD:-tcancy}@postgres:5432/${POSTGRES_DB:-tcancy}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?isi SESSION_SECRET di backend/.env (openssl rand -hex 32)}
      MASTER_KEY: ${MASTER_KEY:?isi MASTER_KEY di backend/.env (openssl rand -base64 32)}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?isi BLIND_INDEX_KEY di backend/.env (openssl rand -hex 32)}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ENCRYPTION_POLICY: ${ENCRYPTION_POLICY:-assignment}
      INTEGRITY_MODE: ${INTEGRITY_MODE:-off}
      UPLOAD_DIR: /data/uploads
      IDENTITY_ACCESS_DAYS: ${IDENTITY_ACCESS_DAYS:-28}
      DOWNLOAD_LIMIT_PER_HOUR: ${DOWNLOAD_LIMIT_PER_HOUR:-20}
      ACCESS_REMINDER_DAYS: ${ACCESS_REMINDER_DAYS:-3}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RATE_REGISTER_LIMIT: ${RATE_REGISTER_LIMIT:-}
      RATE_REGISTER_WINDOW_SECONDS: ${RATE_REGISTER_WINDOW_SECONDS:-}
      RATE_LOGIN_IP_LIMIT: ${RATE_LOGIN_IP_LIMIT:-}
      RATE_LOGIN_IP_WINDOW_SECONDS: ${RATE_LOGIN_IP_WINDOW_SECONDS:-}
      RATE_LOGIN_USER_LIMIT: ${RATE_LOGIN_USER_LIMIT:-}
      RATE_LOGIN_USER_WINDOW_SECONDS: ${RATE_LOGIN_USER_WINDOW_SECONDS:-}
      RATE_DELETE_ACCOUNT_LIMIT: ${RATE_DELETE_ACCOUNT_LIMIT:-}
      RATE_DELETE_ACCOUNT_WINDOW_SECONDS: ${RATE_DELETE_ACCOUNT_WINDOW_SECONDS:-}
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
  uploads: